# Table 5, middle block (HRNet-W48): lambda_I = 0.5, tau = 0.05, all three loss terms.
OUTPUT_DIR: output
WORKERS: 8
PRINT_FREQ: 50
AUTO_RESUME: true
SEED: 0
MODEL:
  DEVICE: cuda
  HEADS:
    TASKS: [mesh]
  BACKBONE: hrnet48
  PRETRAINED: model_files/hrnetv2_w48_imagenet_pretrained.pth
  IIA: {ENABLED: true, POSITIONAL: none}
  GFD: {SPATIAL_ATTENTION: true, CHANNEL_ATTENTION: true, CENTER_OFFSET: true, WINDOW: 0}
DATASET:
  ROOT: data
  DATASET: mesh
  MESH_TRAIN: [muco, coco_smpl, 3dpw_train]
  MESH_TRAIN_WEIGHTS: [1.0, 1.0, 1.0]
  MESH_TEST: 3dpw_test
TRAIN:
  OPTIMIZER: adam
  LR: 0.001
  BACKBONE_LR: 0.0001
  BATCH_SIZE: 64
  END_EPOCH: 140
  LR_STEPS: [90, 120]
  LR_FACTOR: 0.1
TEST: {FLIP_TEST: true, CENTER_THRESHOLD: 0.1, MAX_INSTANCES: 30, NMS_KERNEL: 3}
LOSS: {CENTER_FOCAL: true, CONTRASTIVE: true, INTERACTION: true, INTERACTION_WEIGHT: 0.5, TEMPERATURE: 0.05}
CFG_NAME: ablation_table5_lambda_0.5_mesh
